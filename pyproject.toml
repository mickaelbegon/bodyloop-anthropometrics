[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bodyloop-anthropometrics"
version = "0.1.0"
description = "Reproducible pipeline from BodyLoop 3D scan to anthropometric models (Yeadon, Hatze) and inertial parameters for biorbd/OpenSim"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mickael Begon", email = "mickael.begon@umontreal.ca"}]
keywords = ["biomechanics", "anthropometry", "bodyloop", "yeadon", "hatze", "biorbd", "opensim", "3d-scan"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "click>=8.1",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "trimesh>=4.3",
    "pygltflib>=1.16",
    "yeadon>=1.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
viz = [
    "dash>=2.17",
    "plotly>=5.22",
    "dash-bootstrap-components>=1.6",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "python-semantic-release>=9.8",
    "dash>=2.17",
    "plotly>=5.22",
    "dash-bootstrap-components>=1.6",
]
smpl = [
    "smplx>=0.1.28",
    "torch>=2.3",
]

[project.scripts]
bodyloop-anthro = "bodyloop_anthropometrics.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bodyloop_anthropometrics --cov-report=term-missing --cov-report=html --basetemp=.pytest_tmp"
markers = [
    "unit: fast unit tests (no network, no large files)",
    "integration: integration tests (may need BodyLoop API)",
    "scientific: tests requiring scientific validation",
]

[tool.coverage.run]
omit = ["tests/*", "*/stubs/*"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
