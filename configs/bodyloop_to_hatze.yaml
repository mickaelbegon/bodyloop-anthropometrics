# Mapping BodyLoop measurements to the Hatze (1979) 242-measurement set
# Version: 0.1.0 - PROVISIONAL, NOT SCIENTIFICALLY VALIDATED
#
# Primary reference (NOT AVAILABLE to the authors of this file):
#   Hatze, H. (1979). A model for the computational determination of parameter
#   values of anthropomorphic segments. CSIR Technical Report TWISK 79,
#   Pretoria, South Africa.
#   Hatze, H. (1980). J Biomech 13(10):833-843.
#
# Derived from: docs/HATZE_EQUATIONS.md (cheatsheet extraction, audited) and
#               validation/HATZE_PRIMITIVES_AUDIT.md (numerical audit).
#
# Entry count: 242.  Reconstructed per segment from the figures of
# docs/HATZE_EQUATIONS.md section 3:
#   seg  1 trunk          10 slices x 2 semi-axes + 4 lung parameters =  24
#   seg  2 head-neck                                                  =   8
#   seg  3,4 shoulders    5 each                                      =  10
#   seg  5-8 fore/upper arms   10 sections x 2 axes x 4               =  80
#   seg  9,10 hands       8 each                                      =  16
#   seg 11 pelvis                                                     =  12
#   seg 12,13,15,16 thighs/shanks  10 sections x 2 axes x 4           =  80
#   seg 14,17 feet        6 each                                      =  12
#                                                            total    = 242
#
# ---------------------------------------------------------------------------
# WARNING 1 - the measurement-to-parameter equations are MISSING
# ---------------------------------------------------------------------------
# The cheatsheet does NOT contain the equations mapping Hatze's measurements to
# the primitive parameters (a, b, c, r, h, l).  Every entry below therefore
# records WHICH primitive parameter it feeds, not HOW.  The adapter
# (bodyloop_anthropometrics/anthropometry/hatze_adapter.py) raises
# NotImplementedError for every parameter computation until Hatze (1979) is
# obtained.  See SCIENCE_DECISIONS.md.
#
# ---------------------------------------------------------------------------
# WARNING 2 - primitive A1.4 is BLOCKED
# ---------------------------------------------------------------------------
# The elliptic octoparaboloid A1.4 has numerically wrong published
# coefficients (validation/HATZE_PRIMITIVES_AUDIT.md).  Every entry feeding it
# carries `blocked: true` and any attempt to use it raises RuntimeError.
#
# ---------------------------------------------------------------------------
# WARNING 3 - BodyLoop path vocabulary is PROVISIONAL
# ---------------------------------------------------------------------------
# TODO_SCIENTIFIC: BodyLoop path vocabulary not confirmed.  Every
# `bodyloop_path` below follows the naming convention of
# `bodyloop_anthropometrics/api/export.py` but the labels actually emitted by
# the scanner have NOT been verified.  A path that does not resolve is reported
# in `MeasurementSet.missing` - it is NEVER imputed (AGENTS.md rule 2).
#
# ---------------------------------------------------------------------------
# Format per key:  h<segment>_<slot>_<axis>
# ---------------------------------------------------------------------------
#   description: str                 what the measurement is
#   primitive: str                   Hatze primitive fed (A1.1 ... A1.9,
#                                    'composite' or 'ellipsoid' when the
#                                    cheatsheet gives no decomposition)
#   parameter: str                   parameter fed (a, b, c, h, r, R, l, theta)
#   segment: int                     1 .. 17
#   slice: int                       cross-section index, when applicable
#   unit: "m" | "rad"                internal SI units (AGENTS.md rule 5)
#   source: direct | calculated | interpolated | external | manual
#   bodyloop_path: str | null        dotted path, null when not directly
#                                    readable
#   frame: str                       reference frame
#   confidence: float                0.0 unknown ... 1.0 direct measurement
#   manual_validation_required: bool
#   path_note: str                   provisional-path caveat
#   notes: str                       TODO_SCIENTIFIC / TODO_VALIDATE caveats
#   blocked: true                    present only on A1.4 entries


# ==========================================================================
# SEGMENT 1 - ABDOMINO-THORACIC TRUNK (24)
# 10 stacked elliptic cylinders (A1.1) of height l/10, plus two hollow
# half-cylindrical lung cavities (A1.6).  Figure F2.1/F2.2.
# Slice 1 is the DISTAL slice (origin O_1 at the base, Z_1 superior).
# Axis convention: a_i = ML (X), b_i = AP (Y) - see the A1.1 audit
# correction in docs/HATZE_EQUATIONS.md (the cheatsheet header is wrong).
# ==========================================================================

