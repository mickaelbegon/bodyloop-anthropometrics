# Mapping BodyLoop measurements to Hatze (1979/1980) segment parameters
# Version: 0.1.0
#
# Primary references:
#   Hatze, H. (1979). A model for the computational determination of parameter
#     values of anthropomorphic segments. CSIR Technical Report TWISK 79.
#   Hatze, H. (1980). A mathematical model for the computational determination
#     of parameter values of anthropomorphic segments. J Biomech 13(10):833-843.
#
# WARNING: the hatze-biomech MATLAB reference implementation explicitly states
#          that some equations are incomplete or incorrect.  Every entry in this
#          file must be validated against the original CSIR Technical Report
#          before use in research.  See SCIENCE_DECISIONS.md.
#
# Format per segment:
#   segment_name:
#     description: ""       # anatomical description of the segment
#     measurements:
#       hatze_key:
#         bodyloop_path: null  # JSON path or null
#         source_type: null
#         anatomical_definition: ""
#         units: "m"
#         confidence: 0.0
#         manual_validation_required: true
