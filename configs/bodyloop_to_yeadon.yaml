  calculation: "shoulder_joint_centre_height - hip_joint_centre_height, where hip_joint_centre = regression on markers.ASIS_left, markers.ASIS_right, markers.greater_trochanter_left, markers.greater_trochanter_right (Harrington et al. 2007) and shoulder_joint_centre_right = markers.acromion_right offset inferiorly and medially (Rab et al. 2002) (averaged with the left side)"
