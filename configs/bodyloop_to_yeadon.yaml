# ===========================================================================
# LEFT ARM (La) - 18 measurements
# ===========================================================================
# Levels: 0 shoulder joint centre, 1 mid upper arm (computed: 0.5 x La2L),
#         2 elbow joint centre, 3 maximum forearm perimeter,
#         4 wrist joint centre, 5 base of thumb, 6 knuckles, 7 nails.
# Lengths La2L-La4L are measured from La0; La5L-La7L are measured from La4.
# Levels 0-3 are modelled as circles, hence no widths below La4w.

La2L:  # TODO_SCIENTIFIC: requires human validation
  bodyloop_path: null
  source_type: "calculated"
  anatomical_definition: "Distance from the left shoulder joint centre (level 0) to the elbow joint centre (level 2), along the longitudinal axis of the arm."
  calculation: "norm(shoulder_joint_centre_left - elbow_joint_centre_left), where shoulder_joint_centre_left = markers.acromion_left offset inferiorly and medially (Rab et al. 2002) and elbow_joint_centre_left is midway between markers.lateral_epicondyle_left and markers.medial_epicondyle_left"
  units: "m"
  frame: "anatomical_local_left"
  confidence: 0.55
  manual_validation_required: true
  notes: "TODO_SCIENTIFIC: anatomical landmark definition requires validation - see SCIENCE_DECISIONS.md"

La3L:  # TODO_SCIENTIFIC: requires human validation
  bodyloop_path: null
  source_type: "calculated"
  anatomical_definition: "Distance from the left shoulder joint centre (level 0) to the level of maximum forearm perimeter (level 3), along the arm axis."
  calculation: "La2L + axial position of the maximum-convex section of crosssection_series.forearm_left"
  units: "m"
  frame: "anatomical_local_left"
  confidence: 0.55
  manual_validation_required: true
  notes: "TODO_SCIENTIFIC: anatomical landmark definition requires validation - see SCIENCE_DECISIONS.md"

La4L:  # TODO_SCIENTIFIC: requires human validation
  bodyloop_path: null
  source_type: "calculated"
  anatomical_definition: "Distance from the left shoulder joint centre (level 0) to the wrist joint centre (level 4), along the arm axis."
  calculation: "La2L + norm(elbow_joint_centre_left - wrist_joint_centre_left), where wrist_joint_centre_left is midway between markers.ulnar_styloid_left and markers.radial_styloid_left"
  units: "m"
  frame: "anatomical_local_left"
  confidence: 0.55
  manual_validation_required: true
  notes: "TODO_SCIENTIFIC: anatomical landmark definition requires validation - see SCIENCE_DECISIONS.md"

