  calculation: "heights.lowest_front_rib - hip_joint_centre_height; the lowest anterior rib is not a BodyLoop landmark and must be digitised on the rib-cage contour of the scan."
  units: "m"
  frame: "bodyloop_global"
  confidence: 0.3
  manual_validation_required: true
  notes: "TODO_SCIENTIFIC: anatomical landmark definition requires validation - see SCIENCE_DECISIONS.md"

