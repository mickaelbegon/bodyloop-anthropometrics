# Mapping BodyLoop measurements to Yeadon (1990) measurement keys
# Version: 1.0.0
#
# Primary reference:
#   Yeadon, M.R. (1990). The simulation of aerial movement - II. A mathematical
#   inertia model of the human body. Journal of Biomechanics 23(1):67-74.
#   https://yeadon.readthedocs.io/en/latest/measurements.html
#
# Entry count: 95 (Ls 21 + La 18 + Lb 18 + Lj 19 + Lk 19), verified against
# `yeadon.human.Human.measnames` in yeadon 1.5.0.  Side convention:
#   Ls = torso/head-neck,  La = LEFT arm,  Lb = RIGHT arm,
#   Lj = LEFT leg,         Lk = RIGHT leg.
#
# Format per key:
#   <yeadon_key>:
#     bodyloop_path: str|null      dotted path in the normalised BodyLoop data
#                                  (markers.*, distances.*, heights.*,
#                                  crosssections.*, crosssection_series.*).
#                                  null means the value cannot be read directly
#                                  and MUST be derived before use.
#     source_type: str             direct | calculated | interpolated |
#                                  external | manual
#     anatomical_definition: str   Yeadon's definition of the level/quantity
#     calculation: str|null        derivation when source_type != "direct"
#     units: "m"                   every Yeadon measurement is a length
#     frame: str                   reference frame of the quantity
#     confidence: float            0.0 unknown ... 1.0 direct measurement
#     manual_validation_required: bool
#     notes: str|null
#
# ---------------------------------------------------------------------------
# NOTE 1 - convex vs perimeter
# ---------------------------------------------------------------------------
# Yeadon's protocol takes perimeters with a tape measure pulled taut.  A taut
# tape follows the CONVEX HULL of a cross-section, it cannot enter concavities.
# BodyLoop reports both a true contour `perimeter` and a `convex` value for each
# cross-section.  Every Yeadon perimeter key below therefore maps to the
# `convex` value.  Using `perimeter` overestimates girth wherever the contour is
# concave (waist, ankle, wrist, between the toes) and silently inflates the
# stadium-solid volumes.
# TODO_VALIDATE: quantify the convex-vs-perimeter difference on real scans.
#
# ---------------------------------------------------------------------------
# NOTE 2 - BodyLoop path vocabulary is PROVISIONAL
# ---------------------------------------------------------------------------
# The complete BodyLoop OpenAPI specification is not publicly documented
# (see docs/RESEARCH.md, TODO_SCIENTIFIC #1).  The `bodyloop_path` values below
# follow the normalised-export naming convention of
# `bodyloop_anthropometrics/api/export.py` but the exact labels emitted by the
# scanner have NOT been confirmed.  A path that does not resolve is reported in
# `MeasurementSet.missing` - it is never imputed.
#
# ---------------------------------------------------------------------------
# NOTE 3 - levels yeadon computes for you
# ---------------------------------------------------------------------------
# Four quantities are absent from the 95 keys because yeadon derives them:
#   La1 / Lb1  mid upper-arm level  = 0.5 x La2L
#   Lj2 / Lk2  mid-thigh level      = 0.5 x (Lj1L + Lj3L)
#   Lj7 / Lk7  foot-arch level      = 0.5 x (Lj6L + Lj8L)
#   Lj0p / Lk0p  crotch perimeter   derived from Ls0p and Ls0w
# The PERIMETERS at those computed levels (La1p, Lj2p, Lj7p, ...) are still
# required inputs and must be taken at the computed location, not at the
# nearest convenient girth.
#
# ---------------------------------------------------------------------------
# NOTE 4 - difficult anatomical landmarks
# ---------------------------------------------------------------------------
# The following Yeadon landmarks have no unambiguous optical-scan definition
# and every key that depends on them carries manual_validation_required: true:
#   hip joint centre, shoulder joint centre, acromion, crotch, heel,
#   foot arch, nipple, base of thumb, lowest anterior rib.
# See SCIENCE_DECISIONS.md, entry "Yeadon difficult anatomical landmarks".
#
# TODO_SCIENTIFIC: no key may be set to manual_validation_required: false until
#                  its anatomical definition has been confirmed against
#                  Yeadon (1990) Table 1 and Figure 1.


# ===========================================================================
# TORSO + HEAD-NECK (Ls) - 21 measurements
# ===========================================================================
# Levels: Ls0 hip joint centre, Ls1 umbilicus, Ls2 lowest front rib,
#         Ls3 nipple, Ls4 shoulder joint centre, Ls5 acromion,
#         Ls6 beneath the nose, Ls7 above the ear, Ls8 top of the head.
# Lengths Ls1L-Ls5L are measured from Ls0; Ls6L-Ls8L are measured from Ls5.
# There is no Ls4p and no Ls8p in Yeadon's set.

Ls1L:  # TODO_SCIENTIFIC: requires human validation
  bodyloop_path: null
  source_type: "calculated"
  anatomical_definition: "Distance from the hip joint centre level (Ls0) to the umbilicus level (Ls1), measured along the longitudinal axis of the torso."
  calculation: "heights.umbilicus - hip_joint_centre_height, where hip_joint_centre = regression on markers.ASIS_left, markers.ASIS_right, markers.greater_trochanter_left, markers.greater_trochanter_right (Harrington et al. 2007)"
  units: "m"
  frame: "bodyloop_global"
  confidence: 0.55
  manual_validation_required: true
  notes: "TODO_SCIENTIFIC: anatomical landmark definition requires validation - see SCIENCE_DECISIONS.md"

Ls2L:  # TODO_SCIENTIFIC: requires human validation
